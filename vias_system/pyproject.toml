[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vias-system"
version = "1.0.0"
description = "VIAS 虚实融合身份推断完全体 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "joblib>=1.4",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
